<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音乐管理 - Hexo Pro</title>
<style>
:root{
  --bg:#f5f5f5;
  --bg-container:#ffffff;
  --bg-card:#ffffff;
  --bg-item:#fafafa;
  --bg-hover:#f0f5ff;
  --bg-input:#ffffff;
  --bg-primary-soft:#e6f7ff;
  --bg-success-soft:#f6ffed;
  --text:#333333;
  --text-secondary:#666666;
  --text-tertiary:var(--text-tertiary)999;
  --text-faint:#bbbbbb;
  --border:#e8e8e8;
  --border-strong:#d9d9d9;
  --border-soft:#f0f0f0;
  --divider:#f0f0f0;
  --track:#e8e8e8;
  --primary:#1890ff;
  --primary-hover:#40a9ff;
  --danger:#ff4d4f;
  --success:#52c41a;
  --shadow-card:0 1px 2px rgba(0,0,0,.06);
  --shadow-drop:0 4px 12px rgba(0,0,0,.15);
  --shadow-modal:0 8px 32px rgba(0,0,0,.2);
}
html[data-theme="dark"]{
  --bg:#141414;
  --bg-container:#1f1f1f;
  --bg-card:#1f1f1f;
  --bg-item:#1a1a1a;
  --bg-hover:#262626;
  --bg-input:#141414;
  --bg-primary-soft:rgba(24,144,255,.15);
  --bg-success-soft:rgba(82,196,26,.15);
  --text:rgba(255,255,255,.88);
  --text-secondary:rgba(255,255,255,.65);
  --text-tertiary:rgba(255,255,255,.45);
  --text-faint:#555555;
  --border:#2a2a2a;
  --border-strong:#3a3a3a;
  --border-soft:#262626;
  --divider:#262626;
  --track:#2a2a2a;
  --primary:#1890ff;
  --primary-hover:#40a9ff;
  --danger:#ff4d4f;
  --success:#52c41a;
  --shadow-card:0 1px 2px rgba(0,0,0,.4);
  --shadow-drop:0 4px 12px rgba(0,0,0,.5);
  --shadow-modal:0 8px 32px rgba(0,0,0,.6);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);transition:background .2s,color .2s}
.header{background:var(--bg-container);padding:0 24px;height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:17px;font-weight:600}
.header a{color:var(--primary);text-decoration:none;font-size:14px;cursor:pointer}
.header a:hover{color:var(--primary-hover)}
.container{max-width:960px;margin:24px auto;padding:0 24px}
.card{background:var(--bg-card);border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow-card)}
.card-title{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.btn{padding:7px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}.btn-danger:hover{background:var(--danger);color:#fff}
.btn-default{background:var(--bg-container);color:var(--text-secondary);border:1px solid var(--border-strong)}.btn-default:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:4px 10px;font-size:12px}
.song-list{display:flex;flex-direction:column;gap:8px}
.song-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--bg-item);border-radius:8px;transition:all .15s;border:1px solid transparent}
.song-item:hover{background:var(--bg-hover);border-color:var(--border)}
.song-cover{width:52px;height:52px;border-radius:8px;object-fit:cover;background:linear-gradient(135deg,#667eea,#764ba2);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;overflow:hidden}
.song-cover img{width:100%;height:100%;object-fit:cover}
.song-info{flex:1;min-width:0}
.song-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-meta{font-size:12px;color:var(--text-tertiary);margin-top:3px;display:flex;gap:12px}
.song-actions{display:flex;gap:6px;flex-shrink:0;align-items:center}
.song-progress{flex:1;min-width:100px;height:10px;background:var(--track);border-radius:5px;cursor:pointer;position:relative}
.song-progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-hover));border-radius:5px;width:0%;position:absolute;left:0;top:0;pointer-events:none}
.song-progress:hover{height:12px;margin-top:-1px}
.song-time{font-size:11px;color:var(--text-tertiary);min-width:70px;text-align:right;white-space:nowrap}
.empty{text-align:center;padding:48px 20px;color:var(--text-faint)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-text{font-size:14px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:5px;font-weight:500}
.form-input{width:100%;padding:8px 12px;border:1px solid var(--border-strong);border-radius:6px;font-size:14px;box-sizing:border-box;background:var(--bg-input);color:var(--text)}
.form-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(24,144,255,.15)}
.form-input::placeholder{color:var(--text-tertiary)}
.upload-file-area{border:2px dashed var(--border-strong);border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:all .2s}
.upload-file-area:hover{border-color:var(--primary);background:var(--bg-primary-soft)}
.upload-file-area.has-file{border-color:var(--success);background:var(--bg-success-soft)}
#uploadFileInfo{font-size:13px;color:var(--text-tertiary)}
.search-item{padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--divider);transition:background .15s}
.search-item:hover{background:var(--bg-hover)}
.search-item:last-child{border-bottom:none}
.search-item-cover{width:36px;height:36px;border-radius:4px;background:var(--track);object-fit:cover;flex-shrink:0}
.search-item-info{flex:1;min-width:0}
.search-item-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-item-artist{font-size:11px;color:var(--text-tertiary)}
.player-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg-container);border-top:1px solid var(--border);padding:10px 24px;display:none;align-items:center;gap:14px;z-index:2147483647}
body{padding-bottom:60px}
.player-bar.active{display:flex}
.progress-wrap{flex:1;display:flex;align-items:center;gap:10px}
.progress-bar{flex:1;height:4px;background:var(--track);border-radius:2px;cursor:pointer}
.progress-fill{height:100%;background:var(--primary);border-radius:2px;transition:width .1s}
.time-text{font-size:11px;color:var(--text-tertiary);min-width:70px;text-align:right}
.toast{position:fixed;top:24px;right:24px;padding:10px 20px;border-radius:6px;color:#fff;font-size:13px;z-index:2000;animation:slideIn .3s}
.toast-success{background:var(--success)}.toast-error{background:var(--danger)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:1000;display:none;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:var(--bg-card);border-radius:12px;padding:24px;width:500px;max-width:90vw;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-modal)}

.confirm-modal{width:380px;max-width:90vw;text-align:center;padding:28px 24px 22px}
.confirm-modal h3{margin:0 0 10px}
.confirm-icon{font-size:42px;line-height:1;margin-bottom:12px}
.confirm-text{color:var(--text-secondary);font-size:14px;line-height:1.6;margin:0 0 22px;word-break:break-all}
.confirm-actions{display:flex;gap:12px;justify-content:center}
.confirm-actions .btn{min-width:88px;justify-content:center;padding:8px 18px;font-size:14px;border-radius:8px}
.btn-danger-solid{background:var(--danger);color:#fff;border:1px solid var(--danger)}
.btn-danger-solid:hover{background:#ff7875;border-color:#ff7875}
</style>
<script>
(function(){
  function applyTheme(){
    var v=null;
    try{v=(window.parent&&window.parent.localStorage)?window.parent.localStorage.getItem('hexo-pro-theme'):null;}catch(e){}
    if(v===null){try{v=localStorage.getItem('hexo-pro-theme');}catch(e){}}
    document.documentElement.setAttribute('data-theme',(v||'light')==='dark'?'dark':'light');
  }
  applyTheme();
  window.addEventListener('storage',function(e){
    if(e.key==='hexo-pro-theme')applyTheme();
  });
})();
</script>
</head>
<body>
<div class="header">
  <h1>🎵 音乐管理</h1>
</div>

<div class="container">
  <div class="card">
    <div class="card-title">
      <span id="songCount">歌曲列表</span>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" onclick="showForm()">+ 本地添加</button>
        <button class="btn btn-default" onclick="showSearchForm()">🔍 搜索添加</button>
      </div>
    </div>
    <div id="songList" class="song-list">
      <div class="empty"><div class="empty-icon">🎵</div><div class="empty-text">加载中...</div></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="formOverlay" onclick="if(event.target===this)hideForm()">
  <div class="modal">
    <h3 id="formTitle">添加歌曲</h3>
    <input type="hidden" id="formId">
    <div class="form-group"><label class="form-label">歌曲标题 <span style="color:#ff4d4f">*</span></label>
      <input type="text" id="formSongTitle" class="form-input" placeholder="输入歌曲标题，自动搜索" oninput="debounceSearch()">
      <div id="searchDropdown" style="display:none;position:absolute;z-index:10;background:var(--bg-container);border:1px solid var(--border-strong);border-radius:6px;width:calc(100% - 40px);max-height:200px;overflow-y:auto;box-shadow:var(--shadow-drop);margin-top:4px"></div>
    </div>
    <div id="searchListWrap" style="display:none;margin-bottom:14px">
      <label class="form-label">搜索结果（滚动加载更多）</label>
      <div id="searchedList" style="max-height:240px;overflow-y:auto;border:1px solid var(--border);border-radius:6px"></div>
    </div>
    <div class="form-group"><label class="form-label">歌手</label><input type="text" id="formArtist" class="form-input" placeholder="输入歌手名称"></div>
    <div class="form-group"><label class="form-label">封面图片</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="text" id="formCover" class="form-input" placeholder="输入图片 URL" style="flex:1">
        <span style="color:var(--text-tertiary);font-size:12px">或</span>
        <label class="btn btn-default btn-sm" style="cursor:pointer;margin:0">
          📁 本地上传
          <input type="file" id="formCoverFile" accept="image/*" style="display:none">
        </label>
      </div>
      <div id="coverPreview" style="margin-top:8px;display:none"><img id="coverPreviewImg" style="width:60px;height:60px;border-radius:6px;object-fit:cover"></div>
    </div>
    <div class="form-group" id="formFileArea"><label class="form-label">MP3 文件</label>
      <div class="upload-file-area" id="uploadFileArea" onclick="document.getElementById('formFileInput').click()">
        <div id="uploadFileInfo">📁 点击选择 MP3 文件</div>
        <input type="file" id="formFileInput" accept="audio/*" style="display:none">
      </div>
    </div>
    <div class="form-group" id="formUrlGroup"><label class="form-label">或填写音乐链接</label><input type="text" id="formUrl" class="form-input" placeholder="https://example.com/song.mp3"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="btn btn-default" onclick="hideForm()">取消</button>
      <button class="btn btn-primary" id="formSubmitBtn" onclick="submitForm()">保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirmOverlay" onclick="if(event.target===this)hideConfirm()">
  <div class="modal confirm-modal">
    <div class="confirm-icon">🗑️</div>
    <h3>删除歌曲</h3>
    <p class="confirm-text" id="confirmText">确定要删除这首歌吗？</p>
    <div class="confirm-actions">
      <button class="btn btn-default" id="confirmCancelBtn" onclick="hideConfirm()">取消</button>
      <button class="btn btn-danger-solid" onclick="doDelete()">删除</button>
    </div>
  </div>
</div>

<div class="player-bar" id="playerBar">
  <div style="flex:1;min-width:0">
    <div id="playerTitle" style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">-</div>
    <div id="playerArtist" style="font-size:11px;color:var(--text-tertiary)">-</div>
  </div>
  <div class="progress-wrap">
    <button class="btn btn-default btn-sm" onclick="playerSeek(-10)">⏪</button>
    <button class="btn btn-primary btn-sm" onclick="playerToggle()" id="playerPlayBtn">▶</button>
    <button class="btn btn-default btn-sm" onclick="playerSeek(10)">⏩</button>
    <div class="progress-bar" onclick="playerClickProgress(event)"><div class="progress-fill" id="progressFill" style="width:0"></div></div>
    <span class="time-text" id="playerTime">0:00 / 0:00</span>
  </div>
  <button class="btn btn-default btn-sm" onclick="playerStop()">✕</button>
</div>

<audio id="audio" style="display:none"></audio>

<script>

const API_BASE = '/hexo-blog/hexopro/api/music';
let songs = [];
let audio = document.getElementById('audio');
let currentSong = null;
let editFile = null;
let editCoverFile = null;
let durations = {};
function getToken(){return localStorage.getItem('hexoProToken')||'';}
function toast(msg,type){const el=document.createElement('div');el.className='toast toast-'+type;el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3000);}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function fmtTime(s){const m=Math.floor(s/60);const sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec;}

async function loadSongs(){
  try{
    const res=await fetch(API_BASE+'/list',{headers:{'Authorization':'Bearer '+getToken()}});
    const json=await res.json();
    songs=json.data||[];
    renderSongs();
    loadDurations();
  }catch(e){document.getElementById('songList').innerHTML='<div class="empty"><div class="empty-icon">❌</div><div class="empty-text">加载失败</div></div>';}
}

function loadDurations(){
  songs.forEach(s=>{
    if(durations[s.id])return;
    const a=new Audio();
    a.preload='metadata';
    a.onloadedmetadata=()=>{durations[s.id]=a.duration;renderSongs();};
    a.onerror=()=>{};
    a.src=s.url;
  });
}

function renderSongs(){
  const el=document.getElementById('songList');
  document.getElementById('songCount').textContent='歌曲列表 ('+songs.length+')';
  if(!songs.length){el.innerHTML='<div class="empty"><div class="empty-icon">🎵</div><div class="empty-text">暂无歌曲，点击上方按钮添加</div></div>';return;}
  el.innerHTML=songs.map(s=>{
    const coverHtml=s.cover?'<div class="song-cover"><img src="'+esc(s.cover)+'" onerror="this.parentElement.innerHTML=\'♪\'"></div>':'<div class="song-cover">♪</div>';
    const isPlaying=currentSong&&currentSong.id===s.id&&!audio.paused;
    const playBtn=isPlaying?'<button class="btn btn-primary btn-sm" onclick="playSong(\''+s.id+'\')">暂停</button>':'<button class="btn btn-default btn-sm" onclick="playSong(\''+s.id+'\')">播放</button>';
    const isCurrent=currentSong&&currentSong.id===s.id;
    const dur=durations[s.id]||0;
    const pct=isCurrent&&dur?(audio.currentTime/dur*100):0;
    const timeText=isCurrent?fmtTime(audio.currentTime)+' / '+fmtTime(dur):'0:00 / '+fmtTime(dur);
    return '<div class="song-item">'+coverHtml+
      '<div class="song-info"><div class="song-title">'+esc(s.title)+'</div>'+
      '<div class="song-meta"><span>'+(s.artist?esc(s.artist):'未知歌手')+'</span></div></div>'+
      '<div class="song-progress" onmousedown="startDrag(event,\''+s.id+'\')"><div class="song-progress-fill" id="prog-'+s.id+'" style="width:'+pct+'%"></div></div>'+
      '<div class="song-time" id="time-'+s.id+'">'+timeText+'</div>'+
      '<div class="song-actions">'+playBtn+
      '<button class="btn btn-default btn-sm" onclick="editSong(\''+s.id+'\')">编辑</button>'+
      '<button class="btn btn-danger btn-sm" onclick="deleteSong(\''+s.id+'\')">删除</button>'+
      '</div></div>';
  }).join('');
}

// Form
function showForm(id){
  document.getElementById('formOverlay').classList.add('active');
  document.getElementById('formId').value='';
  document.getElementById('formSongTitle').value='';
  document.getElementById('formArtist').value='';
  document.getElementById('formCover').value='';
  document.getElementById('formUrl').value='';
  document.getElementById('formFileArea').style.display='';
  document.getElementById('formUrlGroup').style.display='';
  editFile=null;editCoverFile=null;
  document.getElementById('uploadFileInfo').textContent='📁 点击选择 MP3 文件';
  document.getElementById('uploadFileArea').classList.remove('has-file');
  document.getElementById('coverPreview').style.display='none';
  document.getElementById('formTitle').textContent='本地添加歌曲';
  document.getElementById('formSongTitle').focus();
}
function showSearchForm(){
  document.getElementById('formOverlay').classList.add('active');
  document.getElementById('formId').value='';
  document.getElementById('formSongTitle').value='';
  document.getElementById('formArtist').value='';
  document.getElementById('formCover').value='';
  document.getElementById('formUrl').value='';
  document.getElementById('formFileArea').style.display='none';
  document.getElementById('formUrlGroup').style.display='';
  editFile=null;editCoverFile=null;
  document.getElementById('uploadFileInfo').textContent='📁 点击选择 MP3 文件';
  document.getElementById('uploadFileArea').classList.remove('has-file');
  document.getElementById('coverPreview').style.display='none';
  document.getElementById('formTitle').textContent='搜索添加歌曲';
  document.getElementById('formSongTitle').focus();
}
function hideForm(){document.getElementById('formOverlay').classList.remove('active');}

function editSong(id){
  const s=songs.find(x=>x.id===id);if(!s)return;
  showForm();
  document.getElementById('formId').value=id;
  document.getElementById('formSongTitle').value=s.title||'';
  document.getElementById('formArtist').value=s.artist||'';
  document.getElementById('formCover').value=s.cover||'';
  document.getElementById('formUrl').value=s.url||'';
  document.getElementById('formTitle').textContent='编辑歌曲';
}

document.getElementById('formFileInput').onchange=function(){
  if(this.files.length>0){
    editFile=this.files[0];
    document.getElementById('uploadFileInfo').textContent='✅ '+editFile.name;
    document.getElementById('uploadFileArea').classList.add('has-file');
    document.getElementById('formUrl').value='';
    if(!document.getElementById('formSongTitle').value){
      document.getElementById('formSongTitle').value=editFile.name.replace(/\.[^.]+$/,'');
    }
  }
};
document.getElementById('formCoverFile').onchange=function(){
  if(this.files.length>0){
    editCoverFile=this.files[0];
    document.getElementById('formCover').value='';
    const reader=new FileReader();
    reader.onload=e=>{document.getElementById('coverPreviewImg').src=e.target.result;document.getElementById('coverPreview').style.display='block';};
    reader.readAsDataURL(editCoverFile);
  }
};
document.getElementById('formCover').oninput=function(){if(this.value){editCoverFile=null;document.getElementById('coverPreview').style.display='none';}};

async function uploadCoverImage(file){
  const fd=new FormData();fd.append('file',file);
  const res=await fetch(API_BASE+'/upload-cover',{method:'POST',headers:{'Authorization':'Bearer '+getToken()},body:fd});
  const json=await res.json();
  if(json.code===0)return json.data.url;
  throw new Error(json.msg);
}

async function submitForm(){
  const id=document.getElementById('formId').value;
  const title=document.getElementById('formSongTitle').value.trim();
  if(!title){toast('请输入歌曲标题','error');return;}
  // Upload cover if local file selected
  let coverUrl=document.getElementById('formCover').value.trim();
  if(editCoverFile){try{coverUrl=await uploadCoverImage(editCoverFile);}catch(e){toast('封面上传失败','error');return;}}
  // Edit mode
  if(id){
    const data={id,title,artist:document.getElementById('formArtist').value.trim(),cover:coverUrl};
    try{
      const res=await fetch(API_BASE+'/update',{method:'POST',headers:{'Authorization':'Bearer '+getToken(),'Content-Type':'application/json'},body:JSON.stringify(data)});
      const json=await res.json();
      if(json.code===0){toast('保存成功','success');const i=songs.findIndex(s=>s.id===id);if(i>=0)songs[i]=json.data;renderSongs();hideForm();}
      else toast('保存失败','error');
    }catch(e){toast('保存出错','error');}
    return;
  }
  // Add mode - URL
  const urlInput=document.getElementById('formUrl').value.trim();
  if(urlInput&&!editFile){
    const data={title,artist:document.getElementById('formArtist').value.trim(),cover:coverUrl,url:urlInput};
    try{
      const res=await fetch(API_BASE+'/add-url',{method:'POST',headers:{'Authorization':'Bearer '+getToken(),'Content-Type':'application/json'},body:JSON.stringify(data)});
      const json=await res.json();
      if(json.code===0){toast('添加成功','success');songs.push(json.data);loadDurations();renderSongs();hideForm();}
      else toast('添加失败','error');
    }catch(e){toast('添加出错','error');}
    return;
  }
  // Add mode - file
  if(!editFile){toast('请填写音乐链接或选择MP3文件','error');return;}
  const fd=new FormData();fd.append('file',editFile);fd.append('title',title);
  fd.append('artist',document.getElementById('formArtist').value.trim());fd.append('cover',coverUrl);
  try{
    const res=await fetch(API_BASE+'/upload',{method:'POST',headers:{'Authorization':'Bearer '+getToken()},body:fd});
    const json=await res.json();
    if(json.code===0){toast('上传成功','success');songs.push(json.data);loadDurations();renderSongs();hideForm();}
    else toast('上传失败','error');
  }catch(e){toast('上传出错','error');}
}

// Player
function playSong(id){
  const song=songs.find(s=>s.id===id);if(!song)return;
  if(!song.url||song.url===''){toast('该歌曲无播放链接，请编辑后填写链接','error');return;}
  if(currentSong&&currentSong.id===id){if(audio.paused){audio.play();}else{audio.pause();}renderSongs();return;}
  currentSong=song;audio.src=song.url;audio.play();
  document.getElementById('playerBar').classList.add('active');
  document.getElementById('playerTitle').textContent=song.title;
  document.getElementById('playerArtist').textContent=song.artist||'未知歌手';
  document.getElementById('playerPlayBtn').textContent='⏸';renderSongs();
}
function playerToggle(){if(audio.paused){audio.play();}else{audio.pause();}renderSongs();}
function playerSeek(sec){audio.currentTime=Math.max(0,Math.min(audio.duration||0,audio.currentTime+sec));}
function playerStop(){audio.pause();audio.currentTime=0;document.getElementById('playerBar').classList.remove('active');}
function playerClickProgress(e){const r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*(audio.duration||0);}

// Song list progress bar
let isDragging=false;
function startDrag(e,id){
  e.preventDefault();
  e.stopPropagation();
  const prog=e.currentTarget;
  function onMove(ev){
    const r=prog.getBoundingClientRect();
    const pct=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width));
    const fill=prog.querySelector('.song-progress-fill');
    if(fill)fill.style.width=(pct*100)+'%';
    if(currentSong&&currentSong.id===id&&audio.duration){
      audio.currentTime=pct*audio.duration;
    }
  }
  function onUp(){
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
  }
  document.addEventListener('mousemove',onMove,false);
  document.addEventListener('mouseup',onUp,false);
  onMove(e);
}
audio.ontimeupdate=()=>{
  if(isDragging)return;
  const pct=audio.duration?(audio.currentTime/audio.duration*100):0;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('playerTime').textContent=fmtTime(audio.currentTime)+' / '+fmtTime(audio.duration||0);
  if(currentSong){
    const fill=document.getElementById('prog-'+currentSong.id);
    const timeEl=document.getElementById('time-'+currentSong.id);
    if(fill)fill.style.width=pct+'%';
    if(timeEl)timeEl.textContent=fmtTime(audio.currentTime)+' / '+fmtTime(audio.duration||0);
  }
};
audio.onended=()=>{document.getElementById('playerPlayBtn').textContent='▶';};
audio.onpause=()=>{document.getElementById('playerPlayBtn').textContent='▶';};
audio.onplay=()=>{document.getElementById('playerPlayBtn').textContent='⏸';};

// Search
let searchTimer=null,searchOffset=0,searchHasMore=true,searchedList=[],searchLoading=false,searchKeywords='';
function debounceSearch(){
  clearTimeout(searchTimer);
  const val=document.getElementById('formSongTitle').value.trim();
  if(val.length<2){document.getElementById('searchDropdown').style.display='none';document.getElementById('searchListWrap').style.display='none';return;}
  searchTimer=setTimeout(()=>{searchOffset=0;searchHasMore=true;searchedList=[];autoSearch(val,true);},500);
}
async function autoSearch(keywords,replace){
  if(searchLoading)return;
  searchLoading=true;
  searchKeywords=keywords;
  try{
    const res=await fetch(API_BASE+'/search?keywords='+encodeURIComponent(keywords)+'&limit=10&offset='+searchOffset);
    const json=await res.json();
    searchLoading=false;
    if(json.code!==0||!json.data||!json.data.length){searchHasMore=false;if(replace)document.getElementById('searchedList').innerHTML='<div class="empty">未找到相关歌曲</div>';return;}
    if(json.data.length<10)searchHasMore=false;
    if(replace)searchedList=json.data;else searchedList=searchedList.concat(json.data);
    searchOffset+=json.data.length;
    renderSearchList();
  }catch(e){searchLoading=false;}
}
function renderSearchList(){
  const dd=document.getElementById('searchedList');
  document.getElementById('searchListWrap').style.display='block';
  dd.innerHTML=searchedList.map((s,i)=>'<div class="search-item" onclick="selectSearchResult('+i+')">'+
    (s.cover?'<img class="search-item-cover" src="'+esc(s.cover)+'" onerror="this.style.display=\'none\'">':'<div class="search-item-cover" style="display:flex;align-items:center;justify-content:center;font-size:16px">♪</div>')+
    '<div class="search-item-info"><div class="search-item-name">'+esc(s.name)+'</div>'+
    '<div class="search-item-artist">'+esc(s.artist)+(s.album?' · '+esc(s.album):'')+'</div></div></div>').join('')+
    (searchHasMore?'<div id="scrollSentinel" style="text-align:center;padding:8px;color:var(--text-tertiary);font-size:12px">加载中...</div>':'<div style="text-align:center;padding:8px;color:var(--text-tertiary);font-size:12px">没有更多了</div>');
  // Setup infinite scroll
  dd.onscroll=function(){
    if(!searchHasMore||searchLoading)return;
    if(dd.scrollTop+dd.clientHeight>=dd.scrollHeight-20){
      autoSearch(searchKeywords,false);
    }
  };
}
function selectSearchResult(idx){
  const s=searchedList[idx];
  if(!s)return;
  document.getElementById('formSongTitle').value=s.name;
  document.getElementById('formArtist').value=s.artist;
  if(s.cover)document.getElementById('formCover').value=s.cover;
  document.getElementById('searchDropdown').style.display='none';
  document.getElementById('searchListWrap').style.display='none';
  document.getElementById('formUrl').value='获取中...';
  fetch(API_BASE+'/song-url?id='+s.id).then(r=>r.json()).then(json=>{
    if(json.code===0&&json.data.url){
      document.getElementById('formUrl').value=json.data.url;
    }else{
      document.getElementById('formUrl').value='';
      toast('该歌曲需要VIP，无法获取链接，请手动填写','error');
    }
  }).catch(()=>{document.getElementById('formUrl').value='';toast('获取链接失败','error');});
}
document.addEventListener('click',function(e){
  if(!e.target.closest('#formSongTitle')&&!e.target.closest('#searchDropdown')&&!e.target.closest('#searchedList')){
    document.getElementById('searchDropdown').style.display='none';
  }
});

let pendingDeleteId=null;
function deleteSong(id){
  const s=songs.find(x=>String(x.id)===String(id));
  document.getElementById('confirmText').textContent='确定要删除「'+(s?s.title:'这首歌')+'」吗？删除后无法恢复。';
  pendingDeleteId=id;
  document.getElementById('confirmOverlay').classList.add('active');
  document.getElementById('confirmCancelBtn').focus();
}
function hideConfirm(){
  pendingDeleteId=null;
  document.getElementById('confirmOverlay').classList.remove('active');
}
async function doDelete(){
  const id=pendingDeleteId;
  if(id==null)return;
  hideConfirm();
  try{
    const res=await fetch(API_BASE+'/delete',{method:'POST',headers:{'Authorization':'Bearer '+getToken(),'Content-Type':'application/json'},body:JSON.stringify({id})});
    const json=await res.json();
    if(json.code===0){toast('已删除','success');songs=songs.filter(s=>String(s.id)!==String(id));renderSongs();}
    else toast('删除失败','error');
  }catch(e){toast('删除出错','error');}
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(document.getElementById('confirmOverlay').classList.contains('active'))hideConfirm();
    else if(document.getElementById('formOverlay').classList.contains('active'))hideForm();
  }
});
loadSongs();
</script>
</body>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音乐管理 - Hexo Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#333;min-height:100vh}
.header{background:#fff;padding:16px 24px;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:20px;font-weight:600}
.header a{color:#1890ff;text-decoration:none;font-size:14px}
.container{max-width:960px;margin:24px auto;padding:0 24px}
.card{background:#fff;border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card-title{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:14px;transition:all .2s}
.btn-primary{background:#1890ff;color:#fff}.btn-primary:hover{background:#40a9ff}
.btn-danger{background:#ff4d4f;color:#fff}.btn-danger:hover{background:#ff7875}
.btn-sm{padding:4px 12px;font-size:12px}
.btn-ghost{background:transparent;border:1px solid #d9d9d9;color:#666}.btn-ghost:hover{border-color:#1890ff;color:#1890ff}
.upload-zone{border:2px dashed #d9d9d9;border-radius:8px;padding:40px;text-align:center;cursor:pointer;transition:all .2s}
.upload-zone:hover,.upload-zone.dragover{border-color:#1890ff;background:#e6f7ff}
.upload-zone p{color:#999;font-size:14px;margin-top:8px}
.song-list{display:flex;flex-direction:column;gap:12px}
.song-item{display:flex;align-items:center;gap:16px;padding:12px 16px;background:#fafafa;border-radius:8px;transition:all .2s}
.song-item:hover{background:#f0f0f0}
.song-cover{width:56px;height:56px;border-radius:6px;object-fit:cover;background:#e8e8e8;flex-shrink:0}
.song-cover-placeholder{width:56px;height:56px;border-radius:6px;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;flex-shrink:0}
.song-info{flex:1;min-width:0}
.song-title{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-artist{font-size:13px;color:#999;margin-top:2px}
.song-actions{display:flex;gap:8px;flex-shrink:0}
.player-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e8e8e8;padding:12px 24px;display:none;align-items:center;gap:16px;z-index:100}
.player-bar.active{display:flex}
.player-info{flex:1;min-width:0}
.player-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-artist{font-size:12px;color:#999}
.player-controls{display:flex;align-items:center;gap:12px}
.player-controls button{background:none;border:none;cursor:pointer;font-size:20px;color:#333;padding:4px}
.player-controls button:hover{color:#1890ff}
.progress-bar{flex:1;height:4px;background:#e8e8e8;border-radius:2px;cursor:pointer;min-width:200px}
.progress-fill{height:100%;background:#1890ff;border-radius:2px;transition:width .1s}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:1000;display:none;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:8px;padding:24px;width:400px;max-width:90vw;max-height:80vh;overflow-y:auto}
.modal h3{font-size:16px;margin-bottom:16px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;color:#666;margin-bottom:4px}
.form-group input{width:100%;padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:14px}
.form-group input:focus{outline:none;border-color:#1890ff;box-shadow:0 0 0 2px rgba(24,144,255,.2)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.empty{text-align:center;padding:40px;color:#999}
.toast{position:fixed;top:24px;right:24px;padding:12px 20px;border-radius:6px;color:#fff;font-size:14px;z-index:2000;animation:slideIn .3s}
.toast-success{background:#52c41a}.toast-error{background:#ff4d4f}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
</style>
</head>
<body>
<div class="header">
  <h1>🎵 音乐管理</h1>
  <a href="/hexo-blog/pro/">← 返回管理后台</a>
</div>

<div class="container">
  <div class="card">
    <div class="card-title">
      <span>歌曲列表</span>
      <button class="btn btn-primary" onclick="showUpload()">+ 上传歌曲</button>
    </div>
    <div id="songList" class="song-list">
      <div class="empty">加载中...</div>
    </div>
  </div>

  <div class="card">
    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
      <div style="font-size:40px">📁</div>
      <p>点击或拖拽 MP3 文件到这里上传</p>
      <input type="file" id="fileInput" accept="audio/*" multiple style="display:none" onchange="handleUpload(this.files)">
    </div>
  </div>
</div>

<div class="player-bar" id="playerBar">
  <div class="player-info">
    <div class="player-title" id="playerTitle">-</div>
    <div class="player-artist" id="playerArtist">-</div>
  </div>
  <div class="player-controls">
    <button onclick="playerSeek(-10)">⏪</button>
    <button onclick="playerToggle()" id="playerPlayBtn">▶</button>
    <button onclick="playerSeek(10)">⏩</button>
  </div>
  <div class="progress-bar" onclick="playerClickProgress(event)">
    <div class="progress-fill" id="progressFill" style="width:0"></div>
  </div>
  <span id="playerTime" style="font-size:12px;color:#999;min-width:80px;text-align:right">0:00 / 0:00</span>
  <button class="btn btn-ghost btn-sm" onclick="playerStop()">✕</button>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>编辑歌曲信息</h3>
    <input type="hidden" id="editId">
    <div class="form-group">
      <label>歌曲标题</label>
      <input type="text" id="editTitle" placeholder="输入歌曲标题">
    </div>
    <div class="form-group">
      <label>歌手</label>
      <input type="text" id="editArtist" placeholder="输入歌手名称">
    </div>
    <div class="form-group">
      <label>封面图片 URL</label>
      <input type="text" id="editCover" placeholder="输入封面图片地址">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<audio id="audio" style="display:none"></audio>

<script>
const API_BASE = '/hexo-blog/hexopro/api/music';
let songs = [];
let audio = document.getElementById('audio');
let currentSong = null;

function getToken() {
  return localStorage.getItem('hexoProToken') || '';
}

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

async function loadSongs() {
  try {
    const res = await fetch(API_BASE + '/list', {
      headers: { 'Authorization': 'Bearer ' + getToken() }
    });
    const json = await res.json();
    songs = json.data || [];
    renderSongs();
  } catch (e) {
    document.getElementById('songList').innerHTML = '<div class="empty">加载失败: ' + e.message + '</div>';
  }
}

function renderSongs() {
  const el = document.getElementById('songList');
  if (!songs.length) {
    el.innerHTML = '<div class="empty">暂无歌曲，点击上方按钮上传</div>';
    return;
  }
  el.innerHTML = songs.map(s => `
    <div class="song-item">
      ${s.cover
        ? '<img class="song-cover" src="' + s.cover + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
        : ''}
      <div class="song-cover-placeholder" ${s.cover ? 'style="display:none"' : ''}>♪</div>
      <div class="song-info">
        <div class="song-title">${esc(s.title)}</div>
        <div class="song-artist">${s.artist ? esc(s.artist) : '未知歌手'}</div>
      </div>
      <div class="song-actions">
        <button class="btn btn-ghost btn-sm" onclick="playSong('${s.id}')">▶ 播放</button>
        <button class="btn btn-ghost btn-sm" onclick="editSong('${s.id}')">✏️ 编辑</button>
        <button class="btn btn-danger btn-sm" onclick="deleteSong('${s.id}')">🗑️</button>
      </div>
    </div>
  `).join('');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// Upload
function showUpload() {
  document.getElementById('fileInput').click();
}

const zone = document.getElementById('uploadZone');
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
zone.addEventListener('drop', e => {
  e.preventDefault();
  zone.classList.remove('dragover');
  handleUpload(e.dataTransfer.files);
});

async function handleUpload(files) {
  for (const file of files) {
    const fd = new FormData();
    fd.append('file', file);
    try {
      const res = await fetch(API_BASE + '/upload', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + getToken() },
        body: fd
      });
      const json = await res.json();
      if (json.code === 0) {
        toast('上传成功: ' + file.name, 'success');
        songs.push(json.data);
        renderSongs();
      } else {
        toast('上传失败: ' + json.msg, 'error');
      }
    } catch (e) {
      toast('上传出错: ' + e.message, 'error');
    }
  }
}

// Player
function playSong(id) {
  const song = songs.find(s => s.id === id);
  if (!song) return;
  currentSong = song;
  audio.src = '/hexo-blog/music/' + song.filename;
  audio.play();
  document.getElementById('playerBar').classList.add('active');
  document.getElementById('playerTitle').textContent = song.title;
  document.getElementById('playerArtist').textContent = song.artist || '未知歌手';
  document.getElementById('playerPlayBtn').textContent = '⏸';
}

function playerToggle() {
  if (audio.paused) { audio.play(); document.getElementById('playerPlayBtn').textContent = '⏸'; }
  else { audio.pause(); document.getElementById('playerPlayBtn').textContent = '▶'; }
}

function playerSeek(sec) { audio.currentTime = Math.max(0, Math.min(audio.duration || 0, audio.currentTime + sec)); }
function playerStop() { audio.pause(); audio.currentTime = 0; document.getElementById('playerBar').classList.remove('active'); }

function playerClickProgress(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * (audio.duration || 0);
}

audio.ontimeupdate = () => {
  const pct = audio.duration ? (audio.currentTime / audio.duration * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('playerTime').textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration || 0);
};
audio.onended = () => { document.getElementById('playerPlayBtn').textContent = '▶'; };

function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

// Edit
function editSong(id) {
  const song = songs.find(s => s.id === id);
  if (!song) return;
  document.getElementById('editId').value = id;
  document.getElementById('editTitle').value = song.title || '';
  document.getElementById('editArtist').value = song.artist || '';
  document.getElementById('editCover').value = song.cover || '';
  document.getElementById('editModal').classList.add('active');
}

function closeModal() { document.getElementById('editModal').classList.remove('active'); }

async function saveEdit() {
  const id = document.getElementById('editId').value;
  const data = {
    id: id,
    title: document.getElementById('editTitle').value,
    artist: document.getElementById('editArtist').value,
    cover: document.getElementById('editCover').value
  };
  try {
    const res = await fetch(API_BASE + '/update', {
      method: 'PUT',
      headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const json = await res.json();
    if (json.code === 0) {
      toast('保存成功', 'success');
      const idx = songs.findIndex(s => s.id === id);
      if (idx >= 0) songs[idx] = json.data;
      renderSongs();
      closeModal();
    } else {
      toast('保存失败: ' + json.msg, 'error');
    }
  } catch (e) {
    toast('保存出错: ' + e.message, 'error');
  }
}

async function deleteSong(id) {
  if (!confirm('确定删除这首歌？')) return;
  try {
    const res = await fetch(API_BASE + '/delete', {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id })
    });
    const json = await res.json();
    if (json.code === 0) {
      toast('已删除', 'success');
      songs = songs.filter(s => s.id !== id);
      renderSongs();
    } else {
      toast('删除失败: ' + json.msg, 'error');
    }
  } catch (e) {
    toast('删除出错: ' + e.message, 'error');
  }
}

loadSongs();
</script>
</body>
</html>
